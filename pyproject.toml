[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodalmodel"
version = "0.1.0"
description = "IBI/TransitApp ETA Accuracy Benchmark for transit prediction evaluation"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.10.0",
    "polars>=1.0.0",
    "plotly>=5.0.0",
    "kaleido>=1.3.0",
    "gtfs-realtime-bindings>=1.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
# The hub server; both are already marimo dependencies, pinned here so the
# server has them declared explicitly.
hub = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
multimodalmodel = "multimodalmodel:main"
multimodalmodel-app = "multimodalmodel:run_app"
multimodalmodel-live = "multimodalmodel:run_live_app"
multimodalmodel-mbta = "multimodalmodel:run_mbta_app"
multimodalmodel-hub = "multimodalmodel.hub.server:main"

[dependency-groups]
dev = ["ruff>=0.4.0", "pytest>=8.0.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RUF", "B", "C4"]
ignore = ["E501", "C408"]

[tool.ruff.lint.per-file-ignores]
# marimo cells: E402 (imports in function bodies), B018 (last-expr output)
"app.py" = ["E402", "B018"]
"live_app.py" = ["E402", "B018"]
"mbta_app.py" = ["E402", "B018"]
"trip_app.py" = ["E402", "B018"]
"notebooks/*.py" = ["E402", "B018"]
"scripts/**/*.py" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
